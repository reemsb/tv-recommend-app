<div class="container">
  @if (tvShows.length) {
    <div class="grid">
      @for (show of tvShows; track show.id) {
        <div class="col-6 md:col-3 lg:col-3">
          <app-item [tvItem]="show" />
        </div>
      }
    </div>
    <p-paginator [rows]="20" [totalRecords]="10000" (onPageChange)="onPageChange($event)" />
  }
</div>
