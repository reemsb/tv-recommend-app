@switch (site) {
  @case ('YouTube') {
    @if (videoUrl) {
      <iframe
        width="100%"
        height="315"
        [src]="videoUrl"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    }
  }
}
