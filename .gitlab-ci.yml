default:
  image: node:20-alpine

stages:
  - verify

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

verify:
  stage: verify
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    # CI needs an environment.ts file. The example acts as a stand-in so the
    # build can compile without a real TMDB key (API calls will 401 at runtime,
    # but the bundle still builds).
    - cp src/environments/environment.example.ts src/environments/environment.ts
    - npm run lint
    - npm run build
  artifacts:
    name: "tv-recommend-build-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week
